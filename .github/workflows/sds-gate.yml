# sds-gate — the single required check of the SDS-V2 kit (docs/sds/distribution.md §4).
# Called from a consumer repository (see kit/sds-gate-caller.yml) as:
#   uses: watchout/shirube/.github/workflows/sds-gate.yml@<pinned commit sha>
# The check code is taken from this reusable workflow's own commit (job.workflow_sha), never from the PR head, so a PR
# cannot rewrite the check that judges it. It reads GitHub only and reports one commit status `sds-gate` on the PR head.
# Three judgments only (risk label, changed paths, R2+ audit receipt); it never checks Owner approval (§7).
# Substitution paths (ARC, iyasaka-arc#57 6051365638): (a) the caller runs on pull_request_target, so its definition comes
# from the default branch and a PR's edits to it do not apply to that PR; (b) a PR that adds or changes a workflow (for
# example one that posts its own `sds-gate` success) touches .github/workflows/**, so the gate reports it as effective R4
# and the merging seat reads this run's JSON, not the status colour. Remaining gaps: a ruleset required workflow pinned by
# SHA (Owner, Q-SDS-RULESET-20261008) and an Owner-only account for approvals.
name: sds-gate

on:
  workflow_call:
    inputs:
      pr:
        description: pull request number in the calling repository
        type: number
        required: true
    secrets:
      SHIRUBE_READ_TOKEN:
        required: false

env:
  SHIRUBE_TOOLS: .shirube-tools

jobs:
  sds-gate:
    runs-on: ubuntu-latest
    # One run per PR: a newer event cancels the older run, so an old PASS cannot land after a newer FAIL.
    concurrency:
      group: sds-gate-${{ github.repository }}-${{ inputs.pr }}
      cancel-in-progress: true
    steps:
      - name: Checkout shirube at the reusable workflow's own commit (callee identity)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.SHIRUBE_TOOLS }}
          token: ${{ secrets.SHIRUBE_READ_TOKEN || github.token }}

      - name: Verify tools identity
        run: |
          set -euo pipefail
          test "${{ job.workflow_repository }}" = "watchout/shirube"
          test "$(git -C "$SHIRUBE_TOOLS" rev-parse HEAD)" = "${{ job.workflow_sha }}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Run sds-gate and report a commit status on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -uo pipefail
          head="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
          result="$(node "$SHIRUBE_TOOLS/scripts/sds/gate.mjs" --repo "$REPO" --pr "$PR" --head "$head")"; code=$?
          echo "$result"
          state=success; [ "$code" -eq 0 ] || state=failure
          desc="$(printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);process.stdout.write((r.reason||`PASS ${r.risk_class}`).slice(0,140))})')"
          gh api "repos/$REPO/statuses/$head" -f state="$state" -f context=sds-gate -f description="$desc" \
            -f target_url="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}" > /dev/null
          exit "$code"
