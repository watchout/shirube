# W1 — reusable hygiene workflow (anti-bloat v5 §4.1; handover v5 §1 W1).
# Called from a consumer repository as:
#   uses: watchout/shirube/.github/workflows/hygiene.yml@<resolved commit sha>
# The check scripts are taken from the CALLEE's own commit (job.workflow_repository / job.workflow_sha — the job
# context of a reusable workflow identifies the reusable workflow file itself; the github context belongs to the caller).
# Preconditions (owner, repo settings): while this repository is private, only PRIVATE repositories owned by the same
# account can call it (GitHub: access to a private repository's reusable workflows "is allowed only from private
# repositories"), the Actions access setting must allow them, and the second checkout needs Contents: read on it
# (secrets.SHIRUBE_READ_TOKEN). A public consumer needs this repository to be public (then no setting and no token).
# The workflow file delivery itself never needs a token.
# The consumer's dependencies come from its own lockfile: `npm ci` (package-lock.json) or `bun install --frozen-lockfile`
# (bun.lock), chosen by the `package-manager` input; the tools then run from the consumer's node_modules/.bin.
# Every step fails closed; nothing hides a failure (engineering-standards S8).
# PR size runs after the code checks so that an oversized introduction PR still shows every other result; the optional
# Python step runs last.
name: hygiene

on:
  workflow_call:
    inputs:
      profile:
        description: path of the hygiene profile in the consumer repository
        type: string
        default: .shirube/hygiene-profile.md
      targets:
        description: space-separated directories or tracked files scanned by jscpd / eslint / depcruise
        type: string
        default: src
      node-version:
        type: string
        default: "22"
      package-manager:
        description: how the consumer's dependencies are installed from its lockfile — npm (package-lock.json) or bun (bun.lock)
        type: string
        default: npm
      bun-version:
        description: bun version for setup-bun when package-manager is bun (the consumer's engines / packageManager is the pin)
        type: string
        default: latest
      python:
        description: also run ruff (C901, PLR0915) and vulture
        type: boolean
        default: false
    secrets:
      SHIRUBE_READ_TOKEN:
        required: false

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  RUFF_VERSION: 0.16.9
  VULTURE_VERSION: "2.16"
  SHIRUBE_TOOLS: .shirube-tools
  SHIRUBE_PROFILE: ${{ inputs.profile }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer (full history for diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout shirube tools at the reusable workflow's own commit (callee identity)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ${{ env.SHIRUBE_TOOLS }}
          token: ${{ secrets.SHIRUBE_READ_TOKEN || github.token }}

      - name: Verify tools identity (repository and commit match the callee)
        run: |
          set -euo pipefail
          test "${{ job.workflow_repository }}" = "watchout/shirube"
          test "$(git -C "$SHIRUBE_TOOLS" rev-parse HEAD)" = "${{ job.workflow_sha }}"
          echo "shirube tools: ${{ job.workflow_repository }}@${{ job.workflow_sha }} (caller: ${{ github.repository }}@${{ github.sha }})"

      - name: Setup Node (npm cache only when npm is the package manager)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'npm' && 'npm' || '' }}

      - name: Setup bun
        if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install consumer dependencies from lockfile (npm ci / bun install --frozen-lockfile)
        run: |
          set -euo pipefail
          case "${{ inputs.package-manager }}" in
            npm) npm ci ;;
            bun) bun install --frozen-lockfile ;;
            *) echo '{"check":"install","verdict":"UNOBSERVABLE","why":"package-manager must be npm or bun, got ${{ inputs.package-manager }}"}'; exit 2 ;;
          esac

      - name: Resolve base / head / today
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Every check below runs even when an earlier check failed: a report_only consumer needs the whole picture
      # (on the first consumer, one failing check left eight checks SKIPPED — aun #977 5884009062). Only a failed
      # setup (refs skipped or failed) skips them. The job still fails on any failed check: no continue-on-error,
      # and the last step re-reads every outcome (AB-27, R17).
      - name: Targets are covered by the profile language (B03 guard)
        id: coverage
        if: ${{ !cancelled() && steps.refs.outcome == 'success' }}
        run: node "$SHIRUBE_TOOLS/scripts/hygiene/targets-coverage.mjs" --profile "$SHIRUBE_PROFILE" --targets "${{ inputs.targets }}" --python "${{ inputs.python }}" --today "${{ steps.refs.outputs.today }}"

      - name: File length vs baseline (AB-01, AB-06)
        id: lines
        if: ${{ !cancelled() && steps.refs.outcome == 'success' }}
        run: node "$SHIRUBE_TOOLS/scripts/hygiene/lines-baseline.mjs" --profile "$SHIRUBE_PROFILE" --today "${{ steps.refs.outputs.today }}"

      - name: Large files and gitleaks-config guard (AB-10, AB-18 b/c)
        id: large
        if: ${{ !cancelled() && steps.refs.outcome == 'success' }}
        run: node "$SHIRUBE_TOOLS/scripts/hygiene/large-files.mjs" --profile "$SHIRUBE_PROFILE" --base "${{ steps.refs.outputs.base }}" --head "${{ steps.refs.outputs.head }}" --today "${{ steps.refs.outputs.today }}"

      - name: Cross-file duplication (AB-02, AB-08, AB-13)
        id: jscpd
        if: ${{ !cancelled() && steps.refs.outcome == 'success' }}
        run: node "$SHIRUBE_TOOLS/scripts/hygiene/jscpd-guard.mjs" --profile "$SHIRUBE_PROFILE" --targets "${{ inputs.targets }}" --python "${{ inputs.python }}" --today "${{ steps.refs.outputs.today }}"

      - name: Unused code, production entries (AB-03, AB-08, AB-11)
        id: knip
        if: ${{ !cancelled() && steps.refs.outcome == 'success' }}
        run: test -f knip.jsonc && npx --no-install knip --production --config knip.jsonc

      - name: Dependency direction and cycles (AB-04, AB-08)
        id: depcruise
        if: ${{ !cancelled() && steps.refs.outcome == 'success' }}
        run: test -f .dependency-cruiser.cjs && npx --no-install depcruise --config .dependency-cruiser.cjs ${{ inputs.targets }}

      - name: Structural limits — function length, complexity (AB-12 structural side, AB-13)
        id: structural
        if: ${{ !cancelled() && steps.refs.outcome == 'success' }}
        run: npx --no-install eslint --config "$SHIRUBE_TOOLS/configs/structural-only.config.mjs" ${{ inputs.targets }}

      - name: Exception guard — descriptions, no unlimited disable, expiry (AB-07, AB-12)
        id: guard
        if: ${{ !cancelled() && steps.refs.outcome == 'success' }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npx --no-install eslint --no-inline-config --max-warnings 0 --config "$SHIRUBE_TOOLS/configs/guard-only.config.mjs" ${{ inputs.targets }}

      - name: Secrets — gitleaks pinned by checksum; markers must be registered exceptions (AB-18 a/b/c/d/e)
        id: secrets
        if: ${{ !cancelled() && steps.refs.outcome == 'success' }}
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256_LINUX_X64}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --exit-code 1 --redact --no-banner --log-opts="${{ steps.refs.outputs.base }}..${{ steps.refs.outputs.head }}"
          mkdir -p .hygiene
          ./gitleaks git --ignore-gitleaks-allow --exit-code 0 --redact --no-banner --report-format json --report-path .hygiene/gitleaks-allowed.json --log-opts="${{ steps.refs.outputs.base }}..${{ steps.refs.outputs.head }}"
          node "$SHIRUBE_TOOLS/scripts/hygiene/secret-suppressions.mjs" --profile "$SHIRUBE_PROFILE" --report .hygiene/gitleaks-allowed.json --today "${{ steps.refs.outputs.today }}"

      # AB-05 is a pull-request rule (added lines / changed files of one PR). On a push the diff HEAD~1..HEAD is the
      # merge of an already-reviewed PR, so the same number would fail again for nothing; the step is declared
      # not applicable there (skipped with its reason printed), never silently passed. Every other check still runs.
      - name: PR size (AB-05) — pull_request only
        id: prsize
        if: ${{ !cancelled() && steps.refs.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node "$SHIRUBE_TOOLS/scripts/hygiene/pr-size.mjs" --profile "$SHIRUBE_PROFILE" --base "${{ steps.refs.outputs.base }}" --head "${{ steps.refs.outputs.head }}" --today "${{ steps.refs.outputs.today }}"
      - name: PR size (AB-05) — not applicable on push
        id: prsize_na
        if: ${{ !cancelled() && steps.refs.outcome == 'success' && github.event_name != 'pull_request' }}
        run: echo '{"check":"pr-size","verdict":"NOT_APPLICABLE","why":"AB-05 applies to pull_request events; this run is ${{ github.event_name }}"}'

      - name: Python — ruff C901 / PLR0915 and vulture, pinned versions (AB-17)
        id: python
        if: ${{ !cancelled() && steps.refs.outcome == 'success' && inputs.python }}
        run: |
          set -euo pipefail
          test -f pyproject.toml
          python3 -m pip install --quiet "ruff==${RUFF_VERSION}" "vulture==${VULTURE_VERSION}"
          ruff --version && vulture --version
          ruff check --select C901,PLR0915 .
          vulture --min-confidence 80 $(python3 -c "import tomllib;print(' '.join(tomllib.load(open('pyproject.toml','rb')).get('tool',{}).get('shirube',{}).get('vulture_paths',['src'])))")

      # The job result above is the gate. This step is the list a report_only reader needs: one line per check, and
      # it fails on any failed, cancelled or unexpectedly skipped check, so a green job can never hide a missing check.
      - name: Outcome of every check
        if: ${{ always() }}
        env:
          OUTCOMES: |
            coverage=${{ steps.coverage.outcome }}
            lines=${{ steps.lines.outcome }}
            large-files=${{ steps.large.outcome }}
            jscpd=${{ steps.jscpd.outcome }}
            knip=${{ steps.knip.outcome }}
            depcruise=${{ steps.depcruise.outcome }}
            structural=${{ steps.structural.outcome }}
            guard=${{ steps.guard.outcome }}
            secrets=${{ steps.secrets.outcome }}
            pr-size=${{ steps.prsize.outcome }}
            pr-size-not-applicable=${{ steps.prsize_na.outcome }}
            python=${{ steps.python.outcome }}
        run: |
          set -euo pipefail
          printf '%s\n' "$OUTCOMES" | sed '/^$/d' | tee -a "$GITHUB_STEP_SUMMARY"
          get() { printf '%s\n' "$OUTCOMES" | sed -n "s/^$1=//p"; }
          fail=0
          for k in coverage lines large-files jscpd knip depcruise structural guard secrets; do
            [ "$(get "$k")" = success ] || { echo "hygiene: $k=$(get "$k")"; fail=1; }
          done
          [ "$(get pr-size)" = success ] || [ "$(get pr-size-not-applicable)" = success ] || { echo "hygiene: pr-size=$(get pr-size) not-applicable=$(get pr-size-not-applicable)"; fail=1; }
          [ "$(get python)" = success ] || [ "$(get python)" = skipped ] || { echo "hygiene: python=$(get python)"; fail=1; }
          exit $fail
